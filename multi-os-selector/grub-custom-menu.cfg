#!/bin/bash
# =============================
# Multi-OS Selector GRUB Menu
# Custom boot entry configuration
# =============================

# Arch Linux submenu with DedSec theme
submenu 'Arch Linux' {
    export theme=$prefix/themes/multi-os-selector/theme-dedsec.txt
    insmod gfxmenu
    loadfont $theme
    
    # Import existing Arch Linux entries
    # These will be populated by grub-mkconfig from /etc/grub.d/10_linux
}

# Windows BSOD joke submenu
submenu 'Windows' {
    export theme=$prefix/themes/multi-os-selector/theme-windows-bsod.txt
    insmod gfxmenu
    loadfont $theme
    
    # Joke entry - just displays BSOD, no actual boot
    menuentry 'Windows (Permanent BSOD)' {
        # No boot command - user stuck until ESC
        echo "You have selected the BSOD. Press ESC to escape reality."
    }
}
